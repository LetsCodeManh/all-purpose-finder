<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>finder</title>
    <style>
      :root {
        --bg: #f1f3f6;
        --surface: #fff;
        --soft: #fbfcfd;
        --line: #e3e6ea;
        --line2: #eceff2;
        --ink: #16181d;
        --ink2: #2b303a;
        --dim: #6d7480;
        --dimmer: #9aa1ac;
        --blue: #4c5f91;
        --green: #46ae70;
        --green-soft: #f1faf4;
        --red: #b65542;
        --red-soft: #fff6f2;
        --sans:
          "IBM Plex Sans", Inter, ui-sans-serif, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        --shadow: 0 1px 2px rgba(20, 25, 35, 0.04);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.55 var(--sans);
        padding-bottom: 45px;
      }
      button {
        font: inherit;
      }
      a {
        color: #526fae;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      /* session header */
      #topbar {
        height: 64px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 14px;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      #tabs {
        position: relative;
      }
      .session-trigger {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 10px 7px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        color: var(--ink);
        cursor: pointer;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .session-trigger:hover,
      .session-trigger[aria-expanded="true"] {
        border-color: #c8cfd8;
        background: #fff;
      }
      .session-trigger .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
      }
      .session-trigger .chev {
        font: 9px var(--mono);
        color: var(--dimmer);
        margin-left: 2px;
      }
      .session-menu {
        position: absolute;
        left: 0;
        top: 43px;
        width: 260px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 16px 40px rgba(20, 25, 35, 0.14);
        padding: 6px;
        display: none;
        z-index: 30;
      }
      .session-menu.open {
        display: block;
      }
      .session-option {
        width: 100%;
        border: 0;
        background: transparent;
        border-radius: 7px;
        padding: 9px 10px;
        display: flex;
        align-items: center;
        gap: 9px;
        text-align: left;
        color: var(--ink2);
        cursor: pointer;
      }
      .session-option:hover,
      .session-option.on {
        background: #f3f5f8;
      }
      .session-option .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c8cfd8;
      }
      .session-option.on .dot {
        background: var(--green);
      }
      .session-option .session-status {
        font: 10.5px var(--mono);
        color: var(--dimmer);
        margin-left: auto;
      }
      #session-meta {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .shape-tag {
        font: 500 10.5px var(--mono);
        color: #526086;
        background: #f2f4fb;
        border: 1px solid #e2e6f2;
        padding: 3px 8px;
        border-radius: 5px;
      }
      .form-label {
        font: 11.5px var(--mono);
        color: var(--dimmer);
      }
      #new-session {
        margin-left: auto;
        border: 0;
        background: transparent;
        color: var(--dim);
        cursor: pointer;
        padding: 8px;
        display: flex;
        gap: 9px;
        align-items: center;
      }
      #new-session:hover {
        color: var(--ink);
      }
      .shortcut {
        font: 10.5px var(--mono);
        color: #b4bac3;
      }

      /* workspace and stages */
      #workspace {
        padding: 20px 24px 26px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      #stage-card,
      #document-card,
      #gaps {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      #stage-card {
        padding: 20px 22px;
        display: flex;
        align-items: flex-start;
        gap: 24px;
        min-width: 0;
      }
      #chips {
        display: grid;
        flex: 1;
        min-width: 0;
        max-width: 100%;
      }
      .chip {
        border: 0;
        background: transparent;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        text-align: left;
        cursor: pointer;
        color: inherit;
      }
      .chip-track {
        display: flex;
        align-items: center;
      }
      .chip-dot {
        width: 11px;
        height: 11px;
        border: 2px solid #c8cfd8;
        border-radius: 50%;
        background: #fff;
        flex: none;
        transition: 0.15s;
      }
      .chip-line {
        height: 2px;
        background: var(--line);
        flex: 1;
      }
      .chip-copy {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding-right: 14px;
      }
      .chip-name {
        font-size: 13.5px;
        color: #8a919c;
        letter-spacing: -0.01em;
      }
      .chip-status {
        font: 11px var(--mono);
        color: #a4abb5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip.done .chip-dot {
        border-color: var(--green);
        background: var(--green);
      }
      .chip.done .chip-name {
        color: #5c636e;
      }
      .chip.on .chip-dot {
        border-color: var(--blue);
        background: var(--blue);
        box-shadow: inset 0 0 0 2px #fff;
      }
      .chip.on .chip-name {
        font-weight: 600;
        color: var(--ink);
      }
      .chip.na {
        cursor: help;
      }
      .chip.na .chip-dot {
        border-color: #d5dae0;
      }
      .chip.na .chip-name {
        color: #a4abb5;
      }
      #stage-action {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
        padding-left: 24px;
        border-left: 1px solid var(--line2);
        min-width: 190px;
      }
      #stage-note {
        font: 11px var(--mono);
        color: var(--dimmer);
        text-align: right;
      }

      /* document */
      #content-grid {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        min-width: 0;
      }
      #document-card {
        flex: 2;
        min-width: 0;
        overflow: hidden;
      }
      #doc {
        min-width: 0;
      }
      .dochead {
        padding: 16px 22px 14px;
        border-bottom: 1px solid var(--line2);
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .dochead .title {
        font-size: 16.5px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .dochead .count-badge {
        font: 600 11px var(--mono);
        color: #5c636e;
        background: #eef0f3;
        padding: 2px 7px;
        border-radius: 20px;
      }
      .dochead .file-meta {
        font: 11.5px var(--mono);
        color: var(--dimmer);
        margin-left: auto;
      }
      .docbody {
        padding: 20px 22px 26px;
      }
      .empty {
        color: var(--dimmer);
        padding: 26px 0;
      }
      #doc h1,
      #doc h2,
      #doc h3,
      #doc h4 {
        font-weight: 600;
        line-height: 1.35;
        color: var(--ink);
      }
      #doc .h1 {
        font-size: 21px;
        letter-spacing: -0.022em;
        margin: 0 0 7px;
      }
      #doc .h2 {
        font: 600 11px/1.4 var(--mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #526086;
        margin: 25px 0 10px;
        display: flex;
        align-items: baseline;
        gap: 9px;
      }
      #doc .h2::after {
        content: "";
        height: 1px;
        background: var(--line2);
        flex: 1;
      }
      #doc .h3 {
        font-size: 15px;
        letter-spacing: -0.015em;
        margin: 18px 0 6px;
      }
      #doc .h4 {
        font-size: 13px;
        margin: 14px 0 5px;
        color: var(--dim);
      }
      #doc .ro {
        order: 2;
        font: 400 10.5px var(--mono);
        letter-spacing: 0;
        text-transform: none;
        color: var(--dimmer);
      }
      #doc p {
        margin: 7px 0;
        color: var(--ink2);
        font-size: 13.5px;
        line-height: 1.65;
        white-space: pre-wrap;
        max-width: 100ch;
        text-wrap: pretty;
      }
      #doc hr {
        border: 0;
        border-top: 1px solid var(--line2);
        margin: 20px 0;
      }
      #doc ul {
        margin: 7px 0 16px;
        padding: 0;
        list-style: none;
        max-width: 100ch;
      }
      #doc li {
        position: relative;
        margin: 6px 0;
        padding-left: 18px;
        color: var(--ink2);
        line-height: 1.58;
        text-wrap: pretty;
      }
      #doc li::before {
        content: "—";
        position: absolute;
        left: 0;
        color: #c8cfd8;
      }
      #doc li.sub {
        color: var(--dim);
        padding-left: 30px;
      }
      #doc code {
        font: 12px var(--mono);
        background: #f0f2f5;
        padding: 1px 4px;
        border-radius: 4px;
        color: #4b5565;
      }
      #doc pre.code {
        background: var(--soft);
        border: 1px solid var(--line2);
        border-radius: 8px;
        padding: 12px 14px;
        overflow: auto;
        color: #596273;
        font: 11.5px/1.55 var(--mono);
        margin: 10px 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #doc pre.ro-block {
        border-style: dashed;
      }

      /* tables and sources */
      .table {
        margin: -4px 0 0;
      }
      .row {
        padding: 13px 0;
        border-bottom: 1px solid #f0f2f5;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row .r1 {
        display: flex;
        gap: 9px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .row .ic {
        display: none;
      }
      .row .nm {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.012em;
        color: var(--ink);
      }
      .row .ty,
      .row .me {
        font: 10.5px var(--mono);
        padding: 2px 7px;
        border-radius: 5px;
      }
      .row .ty {
        color: #526086;
        background: #f2f4fb;
        border: 1px solid #e2e6f2;
      }
      .row .me {
        color: #7b8290;
        background: #f2f4f7;
        border: 1px solid #e6e9ed;
      }
      .row .lc {
        font: 11.5px var(--mono);
        color: #a4abb5;
        margin-left: auto;
      }
      .row .r2 {
        color: #5c636e;
        font-size: 12.5px;
        line-height: 1.5;
        margin-top: 4px;
        max-width: 96ch;
      }
      .row .r3 {
        font-size: 11.5px;
        margin-top: 5px;
      }
      .row.plain {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 0;
      }
      .row.plain .c {
        color: var(--dim);
        font-size: 12.5px;
      }
      .row.plain .c b {
        font: 500 10.5px var(--mono);
        color: var(--dimmer);
        margin-right: 3px;
      }

      /* run stats and cards */
      .stats {
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 15px 17px;
        background: var(--soft);
        margin-bottom: 18px;
      }
      .stat-line {
        font: 11.5px var(--mono);
        color: #7b8290;
        margin-bottom: 9px;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 5px 0;
        font: 11.5px var(--mono);
      }
      .bar .bl {
        width: 74px;
        color: var(--dim);
      }
      .bar .bn {
        width: 44px;
        text-align: right;
        color: var(--ink);
      }
      .bar-track {
        height: 6px;
        flex: 1;
        background: #eef0f3;
        border-radius: 20px;
        overflow: hidden;
      }
      .bar .bb {
        height: 100%;
        display: block;
        background: #7082ad;
        border-radius: 20px;
        min-width: 2px;
      }
      .blocked {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--line2);
        color: var(--red);
        font-size: 11.5px;
      }
      .card {
        border: 1px solid #d8dde5;
        border-radius: 10px;
        margin: 13px 0;
        overflow: hidden;
        background: #fff;
      }
      .card:hover {
        border-color: #bcc5d0;
      }
      .card.ticked {
        border-color: #8fcaa5;
        background: var(--green-soft);
      }
      .card-top {
        padding: 14px 16px 15px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .card-title-copy {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        flex: 1;
      }
      .card h3 {
        margin: 0 !important;
        padding: 0 !important;
        font-size: 14.5px !important;
        letter-spacing: -0.015em !important;
      }
      .card-summary {
        font-size: 12.5px;
        color: #5c6472;
        line-height: 1.5;
      }
      .card-source {
        font: 11px var(--mono);
        color: #9aa2af;
        white-space: nowrap;
        margin-left: 16px;
        padding-top: 1px;
      }
      .card-criteria {
        padding: 13px 16px;
        background: var(--soft);
        border-top: 1px solid var(--line2);
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .criterion-row {
        display: grid;
        grid-template-columns: 52px 18px minmax(0, 1fr);
        gap: 8px;
        align-items: baseline;
      }
      .criterion-tier {
        font: 11px var(--mono);
        color: #919aa8;
      }
      .criterion-mark {
        font: 500 12px var(--mono);
      }
      .criterion-mark.pass {
        color: #168a51;
      }
      .criterion-mark.warn {
        color: #b36c12;
      }
      .criterion-mark.fail {
        color: #c9483d;
      }
      .criterion-text {
        font-size: 12.5px;
        line-height: 1.5;
        color: #353c48;
        text-wrap: pretty;
      }
      .card-foot {
        padding: 10px 16px 11px;
        background: var(--soft);
        border-top: 1px solid var(--line2);
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
      }
      .card-metrics {
        font: 600 11.5px var(--mono);
        color: #66707e;
      }
      .card-comment {
        font-size: 12.5px;
        color: #7a8390;
        font-style: italic;
        text-wrap: pretty;
      }
      .tick {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        cursor: pointer;
        margin: 8px 0;
        user-select: none;
      }
      .card-top .tick {
        margin: 1px 0 0;
      }
      .card-top .tick-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .tick input {
        appearance: none;
        width: 16px;
        height: 16px;
        border: 1.5px solid #c8cfd8;
        border-radius: 4px;
        background: #fff;
        margin: 2px 0 0;
        cursor: pointer;
        display: grid;
        place-content: center;
        flex: none;
      }
      .card-top .tick input {
        width: 18px;
        height: 18px;
        margin: 0;
      }
      .tick input::before {
        content: "✓";
        font: 600 11px var(--sans);
        color: #fff;
        transform: scale(0);
      }
      .tick input:checked {
        border-color: var(--green);
        background: var(--green);
      }
      .tick input:checked::before {
        transform: scale(1);
      }
      .tick input:disabled {
        opacity: 0.55;
      }
      .tick-label {
        color: var(--dim);
        font-size: 12.5px;
      }
      .tick input:checked ~ .tick-label {
        color: #287d4b;
      }

      /* criteria */
      .criteria-head .count-badge {
        color: #14673a;
        background: #e4f7ea;
        border: 1px solid #b8e4c6;
        border-radius: 6px;
        padding: 3px 8px;
      }
      .criteria-section {
        margin: 0 0 24px;
      }
      .criteria-section:last-child {
        margin-bottom: 0;
      }
      .criteria-section-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .criteria-name {
        font: 600 11px var(--mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #526086;
        white-space: nowrap;
      }
      .criteria-rule {
        height: 1px;
        background: var(--line2);
        flex: 1;
      }
      .criteria-guide {
        font: 10.5px var(--mono);
        color: #98a1ae;
        white-space: nowrap;
      }
      .criteria-range .criteria-name {
        color: #a46510;
      }
      .criteria-nice .criteria-name,
      .criteria-open .criteria-name,
      .criteria-not-carried-over .criteria-name,
      .criteria-notes .criteria-name {
        color: #7f8896;
      }
      #doc .criteria-section ul {
        max-width: none;
        margin: 0;
      }
      #doc .criteria-section li {
        margin: 8px 0;
        line-height: 1.58;
      }
      .criteria-not-carried-over,
      .criteria-notes {
        padding: 16px 18px;
        background: var(--soft);
        border: 1px solid var(--line2);
        border-radius: 9px;
      }
      .criteria-not-carried-over .criteria-rule,
      .criteria-notes .criteria-rule {
        display: none;
      }
      #doc .criteria-not-carried-over li,
      #doc .criteria-notes li {
        color: #65707f;
      }
      #doc .criteria-not-carried-over .criteria-section-body > p:last-child {
        max-width: none;
        margin: 10px 0 0;
        padding-top: 9px;
        border-top: 1px solid var(--line2);
        color: #7f8896;
        font-size: 12.5px;
      }
      .criteria-prefilter .criteria-section-body {
        color: #5c636e;
      }
      .prefilter-head {
        gap: 9px;
        margin-bottom: 12px;
      }
      .prefilter-derived {
        font: 10.5px var(--mono);
        color: #98a1ae;
        white-space: nowrap;
      }
      .prefilter-patterns {
        position: relative;
        flex: 0 0 auto;
      }
      .prefilter-patterns summary {
        color: #465f9c;
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 600;
        list-style: none;
        white-space: nowrap;
      }
      .prefilter-patterns summary::-webkit-details-marker {
        display: none;
      }
      .prefilter-patterns summary::after {
        content: "";
        display: inline-block;
        margin-left: 5px;
        border: 4px solid transparent;
        border-top-color: #465f9c;
        transform: translateY(3px);
      }
      .prefilter-patterns[open] summary::after {
        transform: translateY(-1px) rotate(180deg);
      }
      .prefilter-patterns[open] summary {
        margin-bottom: 8px;
      }
      #doc .prefilter-patterns pre {
        position: absolute;
        z-index: 2;
        right: 0;
        width: min(880px, 78vw);
        max-height: 300px;
        margin: 0;
        overflow: auto;
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px rgba(28, 36, 49, 0.12);
      }
      #doc .prefilter-intro {
        max-width: 92ch;
        margin: 0 0 12px;
        color: #586170;
        font-size: 12.5px;
        line-height: 1.55;
      }
      .prefilter-rows {
        display: grid;
        gap: 7px;
      }
      .prefilter-row {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        min-height: 40px;
        padding: 0 14px;
        background: var(--soft);
        border: 1px solid var(--line2);
        border-radius: 8px;
        color: #586170;
        font-size: 12.5px;
      }
      .prefilter-key {
        color: #40547d;
        font: 600 11.5px var(--mono);
      }
      #doc .prefilter-loader {
        max-width: none;
        margin: 11px 0 0;
        color: #98a1ae;
        font: 10.5px/1.5 var(--mono);
      }

      /* contacts */
      .contacts-intro {
        max-width: 104ch;
        margin-bottom: 18px;
      }
      .contacts-intro p {
        font-size: 12.5px !important;
        line-height: 1.6 !important;
        color: #59616e !important;
        margin: 0 0 10px !important;
      }
      .contacts-intro strong {
        color: var(--ink);
        font-weight: 600;
      }
      .contacts-intro code {
        font-size: 11.5px !important;
      }
      .contact-list {
        margin-top: 4px;
      }
      .contact-row {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid #f0f2f5;
      }
      .contact-row:last-child {
        border-bottom: 0;
      }
      .contact-identity {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .contact-identity strong {
        font-size: 13.5px;
        letter-spacing: -0.01em;
      }
      .contact-identity span {
        font: 11px var(--mono);
        color: #a1a9b5;
      }
      .contact-detail {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .contact-lead {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-height: 20px;
      }
      .missing-badge {
        font: 600 10.5px var(--mono);
        color: #9c4b1d;
        background: #fff1e8;
        border: 1px solid #f3ceb8;
        padding: 2px 8px;
        border-radius: 5px;
      }
      .contact-who {
        font-size: 13px;
        color: var(--ink2);
      }
      .contact-role {
        font: 11px var(--mono);
        color: #7f8896;
      }
      .contact-how {
        font-size: 12.5px;
        line-height: 1.5;
        color: #59616e;
        text-wrap: pretty;
      }
      .contact-source {
        font: 11px var(--mono);
        color: #a1a9b5;
      }

      /* gaps */
      #gaps {
        width: 352px;
        flex: 1;
        overflow: hidden;
        border-color: #eadfce;
      }
      #gaps[hidden] {
        display: none;
      }
      .gaps-head {
        padding: 15px 20px;
        background: #fffaf2;
        border-bottom: 1px solid #eee2cf;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .gaps-head h2 {
        font-size: 16.5px;
        letter-spacing: -0.015em;
        color: #6e4525;
        margin: 0;
      }
      .gap-count {
        font: 600 11px var(--mono);
        color: #fff;
        background: #c78332;
        padding: 2px 7px;
        border-radius: 20px;
      }
      .gaps-only {
        font: 11px var(--mono);
        color: #a27851;
        margin-left: auto;
      }
      .gaps-body {
        padding: 3px 20px 12px;
      }
      .gap {
        padding: 12px 0;
        border-bottom: 1px solid #f0f2f5;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .gap:last-child {
        border-bottom: 0;
      }
      .gap-top {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .gap-name {
        font-size: 13px;
        font-weight: 600;
        color: #653e27;
        flex: 1;
      }
      .gap-date {
        font: 10.5px var(--mono);
        color: #a4abb5;
      }
      .gap-reason {
        font: 500 10.5px var(--mono);
        color: #a94d39;
        background: var(--red-soft);
        border: 1px solid #efd8d0;
        padding: 2px 7px;
        border-radius: 5px;
        align-self: flex-start;
      }
      .gap-note {
        font-size: 12px;
        color: #5c636e;
        line-height: 1.5;
        text-wrap: pretty;
      }
      .gap a {
        font-size: 11.5px;
      }

      /* terminal and toast */
      #terminal-bar {
        height: 45px;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
        border-top: 1px solid var(--line);
        z-index: 25;
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #terminal-toggle {
        border: 0;
        background: transparent;
        padding: 6px 0;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #4a5160;
        font-weight: 500;
        cursor: pointer;
      }
      #terminal-toggle:hover {
        color: var(--ink);
      }
      .terminal-glyph {
        font-family: var(--mono);
        color: var(--dimmer);
      }
      #terminal-copy {
        font: 11.5px var(--mono);
        color: var(--dimmer);
        flex: 1;
      }
      #term {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 45px;
        height: min(48vh, 520px);
        background: #111419;
        border-top: 1px solid #252a34;
        z-index: 24;
        display: none;
      }
      body.terminal-open #term {
        display: block;
      }
      #term iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .noterm {
        padding: 28px 30px;
        color: #9aa1ac;
        max-width: 560px;
        font: 13px/1.6 var(--mono);
      }
      .noterm b {
        color: #e7e9ed;
      }
      .noterm pre {
        background: #181c23;
        border: 1px solid #2b313c;
        padding: 11px 13px;
        border-radius: 7px;
        color: #64cb82;
        white-space: pre-wrap;
      }
      #note {
        position: fixed;
        left: 24px;
        bottom: 60px;
        background: #20242c;
        color: #fff;
        padding: 9px 13px;
        border-radius: 7px;
        font-size: 12px;
        max-width: min(560px, calc(100vw - 48px));
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
        opacity: 0;
        transform: translateY(6px);
        transition: 0.16s;
        pointer-events: none;
        z-index: 50;
      }
      #note.show {
        opacity: 1;
        transform: none;
      }
      @media (max-width: 900px) {
        #topbar {
          padding: 0 16px;
        }
        .form-label,
        .shortcut {
          display: none;
        }
        #new-session {
          font-size: 0;
        }
        #new-session span:first-child {
          font-size: 12.5px;
        }
        #workspace {
          padding: 16px;
        }
        .shape-tag {
          max-width: 160px;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        #stage-card {
          flex-direction: column;
          padding: 17px;
        }
        #stage-action {
          width: 100%;
          min-width: 0;
          border-left: 0;
          border-top: 1px solid var(--line2);
          padding: 14px 0 0;
          align-items: flex-start;
        }
        #stage-note {
          text-align: left;
        }
        #content-grid {
          flex-direction: column;
        }
        #gaps {
          width: 100%;
        }
        .card-source {
          white-space: normal;
          text-align: right;
        }
      }
      @media (max-width: 620px) {
        #topbar {
          height: auto;
          min-height: 58px;
          flex-wrap: wrap;
          padding-block: 10px;
          gap: 8px;
        }
        #session-meta {
          order: 3;
          width: 100%;
        }
        #stage-card {
          overflow: hidden;
        }
        #chips {
          width: 100%;
          overflow-x: auto;
          grid-template-columns: repeat(
            var(--stage-count),
            minmax(130px, 1fr)
          ) !important;
        }
        .chip {
          min-width: 130px;
        }
        .dochead,
        .docbody {
          padding-left: 16px;
          padding-right: 16px;
        }
        .dochead .file-meta {
          width: 100%;
          margin-left: 0;
        }
        .card-top {
          flex-wrap: wrap;
        }
        .card-source {
          width: 100%;
          margin-left: 30px;
          text-align: left;
        }
        .criterion-row {
          grid-template-columns: 44px 16px minmax(0, 1fr);
          gap: 6px;
        }
        .contact-row {
          grid-template-columns: 1fr;
          gap: 8px;
        }
        .criteria-section-head {
          align-items: flex-start;
          flex-wrap: wrap;
        }
        .criteria-guide {
          width: 100%;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <header id="topbar">
      <nav id="tabs" aria-label="Sessions"></nav>
      <div id="session-meta"></div>
      <button id="new-session" type="button">
        <span>New session</span><span class="shortcut">⌘K to switch</span>
      </button>
    </header>
    <main id="workspace">
      <section id="stage-card" aria-label="Session progress">
        <nav id="chips" aria-label="Stages"></nav>
        <div id="stage-action">
          <div id="stage-note"></div>
        </div>
      </section>
      <div id="content-grid">
        <article id="document-card"><div id="doc"></div></article>
        <aside id="gaps" hidden></aside>
      </div>
    </main>
    <aside id="term" aria-label="Terminal"></aside>
    <footer id="terminal-bar">
      <button id="terminal-toggle" type="button" aria-expanded="false">
        <span class="terminal-glyph">›_</span><span>terminal</span></button
      ><span id="terminal-copy"
        >detached — every session still runs from the files</span
      ><span class="shortcut">⌘J</span>
    </footer>
    <div id="note" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
