<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>finder</title>
    <!-- the stage track, the one idea the whole page is about -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%2316181d%22%2F%3E%3Cpath%20d%3D%22M9%2016h14%22%20stroke%3D%22%234a505c%22%20stroke-width%3D%221.6%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%229%22%20cy%3D%2216%22%20r%3D%222.6%22%20fill%3D%22%236d7480%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%222.6%22%20fill%3D%22%236d7480%22%2F%3E%3Ccircle%20cx%3D%2223%22%20cy%3D%2216%22%20r%3D%223.4%22%20fill%3D%22%2346ae70%22%2F%3E%3C%2Fsvg%3E" />
    <style>
      :root {
        --bg: #f1f3f6;
        --surface: #fff;
        --soft: #fbfcfd;
        --line: #e3e6ea;
        --line2: #eceff2;
        --ink: #16181d;
        --ink2: #2b303a;
        --dim: #6d7480;
        --dimmer: #9aa1ac;
        --blue: #4c5f91;
        --green: #46ae70;
        --green-soft: #f1faf4;
        --red: #b65542;
        --red-soft: #fff6f2;
        --sans:
          "IBM Plex Sans", Inter, ui-sans-serif, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
        --shadow: 0 1px 2px rgba(20, 25, 35, 0.04);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.55 var(--sans);
        padding-bottom: 45px;
      }
      button {
        font: inherit;
      }
      a {
        color: #526fae;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      /* session header */
      #topbar {
        height: 64px;
        background: #fff;
        border-bottom: 1px solid var(--line);
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 14px;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      #tabs {
        position: relative;
      }
      .session-trigger {
        display: flex;
        align-items: center;
        width: 260px;
        gap: 9px;
        padding: 7px 10px 7px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        color: var(--ink);
        cursor: pointer;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .session-trigger:hover,
      .session-trigger[aria-expanded="true"] {
        border-color: #c8cfd8;
        background: #fff;
      }
      .session-trigger .dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
      }
      .session-trigger .session-name {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .session-trigger .chev {
        font: 12px var(--mono);
        color: var(--dimmer);
        margin-left: auto;
        line-height: 1;
      }
      .session-trigger[aria-expanded="true"] .chev {
        transform: rotate(90deg);
      }
      .session-menu {
        position: absolute;
        left: 0;
        top: 43px;
        width: 340px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 16px 40px rgba(20, 25, 35, 0.14);
        padding: 6px;
        display: none;
        z-index: 30;
      }
      .session-menu.open {
        display: block;
      }
      .session-option {
        width: 100%;
        border: 0;
        background: transparent;
        border-radius: 7px;
        padding: 9px 10px;
        display: flex;
        align-items: center;
        gap: 9px;
        text-align: left;
        color: var(--ink2);
        cursor: pointer;
      }
      .session-option .session-name {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .session-option:hover,
      .session-option.on {
        background: #f3f5f8;
      }
      .session-option .dot {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #c8cfd8;
      }
      .session-option.on .dot {
        background: var(--green);
      }
      .session-option .session-status {
        font: 10.5px var(--mono);
        color: var(--dimmer);
        margin-left: auto;
        white-space: nowrap;
      }
      #session-meta {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .shape-tag {
        font: 500 10.5px var(--mono);
        color: #526086;
        background: #f2f4fb;
        border: 1px solid #e2e6f2;
        padding: 3px 8px;
        border-radius: 5px;
      }
      .form-label {
        font: 11.5px var(--mono);
        color: var(--dimmer);
      }
      #new-session {
        margin-left: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        color: var(--dim);
        cursor: pointer;
        padding: 7px 10px;
        display: flex;
        gap: 9px;
        align-items: center;
      }
      #new-session:hover {
        color: var(--ink);
        border-color: #c8cfd8;
        background: #fff;
      }
      .shortcut {
        font: 10.5px var(--mono);
        color: #b4bac3;
      }

      /* workspace and stages */
      #workspace {
        padding: 20px 24px 26px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      #stage-card,
      #document-card,
      #gaps {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      #stage-card {
        padding: 20px 22px;
        display: flex;
        align-items: flex-start;
        gap: 24px;
        min-width: 0;
      }
      #chips {
        display: grid;
        flex: 1;
        min-width: 0;
        max-width: 100%;
      }
      .chip {
        border: 0;
        background: transparent;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
        text-align: left;
        cursor: pointer;
        color: inherit;
      }
      .chip:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      .chip-track {
        display: flex;
        align-items: center;
      }
      .chip-dot {
        width: 11px;
        height: 11px;
        border: 2px solid #c8cfd8;
        border-radius: 50%;
        background: #fff;
        flex: none;
        transition: 0.15s;
      }
      .chip-line {
        height: 2px;
        background: var(--line);
        flex: 1;
      }
      .chip-copy {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding-right: 14px;
        min-height: 32px;
      }
      /* Next Steps selects inputs; the actual choice stays in the terminal. */
      .chip.slot .chip-name {
        color: #a4abb5;
      }
      .chip.slot .chip-dot {
        border-style: dashed;
      }
      .chip.slot.here .chip-dot {
        border-style: solid;
        border-color: var(--blue);
      }
      .chip.slot.here .chip-name {
        color: var(--ink);
        font-weight: 600;
      }
      .chip-name {
        font-size: 13.5px;
        color: #8a919c;
        letter-spacing: -0.01em;
      }
      .chip-status {
        font: 11px var(--mono);
        color: #a4abb5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .chip.done .chip-dot {
        border-color: var(--green);
        background: var(--green);
      }
      .chip.done .chip-name {
        color: #5c636e;
      }
      .chip.on .chip-dot {
        border-color: var(--blue);
        background: var(--blue);
        box-shadow: inset 0 0 0 2px #fff;
      }
      .chip.on .chip-name {
        font-weight: 600;
        color: var(--ink);
      }
      #stage-action {
        flex: 0 0 190px;
        width: 190px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
        padding-left: 24px;
        border-left: 1px solid var(--line2);
      }
      #stage-note {
        font: 11px var(--mono);
        color: var(--dimmer);
        text-align: right;
      }

      /* document */
      #content-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 352px;
        gap: 18px;
        align-items: start;
        min-width: 0;
      }
      #content-grid.sources-layout {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      #content-grid.sources-layout #gaps {
        order: -1;
      }
      #content-grid.criteria-screen {
        grid-template-columns: minmax(0, 1fr);
      }
      #content-grid.criteria-screen #gaps,
      #content-grid.full-screen #gaps {
        display: none;
      }
      #content-grid.full-screen {
        grid-template-columns: minmax(0, 1fr);
      }
      html.sources-page,
      body.sources-page {
        height: 100vh;
        min-height: 0;
        overflow: hidden;
      }
      body.sources-page {
        display: flex;
        flex-direction: column;
      }
      body.sources-page #topbar,
      body.sources-page #stage-card {
        flex: none;
      }
      body.sources-page #workspace,
      body.sources-page #content-grid,
      body.sources-page #main-column,
      body.sources-page #document-card,
      body.sources-page #doc,
      body.sources-page .docbody,
      body.sources-page #gaps {
        min-height: 0;
      }
      body.sources-page #workspace,
      body.sources-page #content-grid,
      body.sources-page #document-card,
      body.sources-page .docbody {
        flex: 1;
      }
      body.sources-page #workspace,
      body.sources-page #content-grid,
      body.sources-page #main-column,
      body.sources-page #document-card {
        overflow: hidden;
      }
      body.sources-page #content-grid {
        align-items: stretch;
      }
      body.sources-page #doc {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      body.sources-page .docbody,
      body.sources-page #gaps,
      body.sources-page #source-sections {
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
      body.sources-page #source-sections {
        flex: none;
        max-height: 34%;
      }
      body.sources-page #document-card.sources-collapsed {
        flex: none;
      }
      body.sources-page #document-card.sources-collapsed .docbody {
        display: none;
      }
      body.sources-page #document-card.sources-collapsed .dochead {
        border-bottom: 0;
      }
      body.sources-page #document-card.sources-collapsed + #source-sections {
        flex: 1;
        max-height: none;
      }
      /* The open section fills the rail. ::details-content is the real flex item —
         flexing <details> and its body alone leaves the body at content height. */
      body.sources-page
        #document-card.sources-collapsed
        + #source-sections
        .source-info-card[open],
      body.sources-page
        #document-card.sources-collapsed
        + #source-sections
        .source-info-card[open]::details-content {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      body.sources-page
        #document-card.sources-collapsed
        + #source-sections
        .source-info-card[open]
        .source-info-body {
        flex: 1;
        min-height: 0;
        max-height: none;
      }
      html.criteria-page,
      body.criteria-page {
        height: 100vh;
        min-height: 0;
        overflow: hidden;
      }
      body.criteria-page {
        display: flex;
        flex-direction: column;
      }
      body.criteria-page #topbar,
      body.criteria-page #stage-card {
        flex: none;
      }
      body.criteria-page #workspace,
      body.criteria-page #content-grid,
      body.criteria-page #main-column,
      body.criteria-page #document-card,
      body.criteria-page #doc,
      body.criteria-page .docbody {
        min-height: 0;
      }
      body.criteria-page #workspace,
      body.criteria-page #content-grid,
      body.criteria-page #document-card,
      body.criteria-page .docbody {
        flex: 1;
      }
      body.criteria-page #workspace,
      body.criteria-page #content-grid,
      body.criteria-page #main-column,
      body.criteria-page #document-card {
        overflow: hidden;
      }
      body.criteria-page #content-grid {
        align-items: stretch;
      }
      body.criteria-page #doc {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      body.criteria-page .docbody {
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
      html.full-page,
      body.full-page {
        height: 100vh;
        min-height: 0;
        overflow: hidden;
      }
      body.full-page {
        display: flex;
        flex-direction: column;
      }
      body.full-page #topbar,
      body.full-page #stage-card {
        flex: none;
      }
      body.full-page #workspace,
      body.full-page #content-grid,
      body.full-page #main-column,
      body.full-page #document-card,
      body.full-page #doc,
      body.full-page .docbody {
        min-height: 0;
      }
      body.full-page #workspace,
      body.full-page #content-grid,
      body.full-page #document-card,
      body.full-page .docbody {
        flex: 1;
      }
      body.full-page #workspace,
      body.full-page #content-grid,
      body.full-page #main-column,
      body.full-page #document-card {
        overflow: hidden;
      }
      body.full-page #content-grid {
        align-items: stretch;
      }
      body.full-page #doc {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      body.full-page .docbody {
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
      #document-card {
        min-width: 0;
        overflow: hidden;
      }
      #doc {
        min-width: 0;
      }
      .dochead {
        min-height: 51px;
        padding: 16px 22px 14px;
        border-bottom: 1px solid var(--line2);
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .dochead .title {
        font-size: 16.5px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .dochead .count-badge {
        font: 600 11px var(--mono);
        color: #5c636e;
        background: #eef0f3;
        padding: 2px 7px;
        border-radius: 20px;
      }
      .dochead .file-meta {
        font: 11.5px var(--mono);
        color: var(--dimmer);
        margin-left: auto;
      }
      .dochead.clickable-head {
        cursor: pointer;
        user-select: none;
      }
      .sources-collapse {
        border: 0;
        background: none;
        padding: 0 2px;
        color: var(--dimmer);
        cursor: pointer;
        font: 14px var(--mono);
        line-height: 1;
      }
      .sources-collapse[aria-expanded="true"] {
        transform: rotate(90deg);
      }
      .sources-collapse:hover {
        color: var(--dim);
      }
      .docbody {
        padding: 20px 22px 26px;
      }
      .empty {
        color: var(--dimmer);
        padding: 26px 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .gate5-body {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .next-steps-shell {
        display: grid;
        grid-template-columns: 210px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        padding: 0;
        min-height: 0;
        overflow: hidden;
      }
      .next-steps-sidebar {
        position: sticky;
        top: 0;
        align-self: start;
        min-height: 100%;
        padding: 14px 10px;
        border-right: 1px solid var(--line2);
        background: var(--soft);
      }
      .next-steps-nav-item {
        width: 100%;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--dim);
        padding: 8px 9px;
        display: flex;
        align-items: center;
        gap: 8px;
        text-align: left;
        cursor: pointer;
        font: 12px var(--sans);
      }
      .next-steps-nav-item:hover {
        background: #fff;
        color: var(--ink);
      }
      .next-steps-nav-item.on {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 1px 4px rgba(25, 32, 45, 0.08);
        font-weight: 600;
      }
      .next-steps-nav-item.root {
        margin-bottom: 10px;
      }
      .next-steps-nav-icon,
      .tree-branch {
        width: 14px;
        flex: none;
        color: var(--dimmer);
        text-align: center;
        font: 11px var(--mono);
      }
      .output-tree {
        border-top: 1px solid var(--line2);
        padding-top: 10px;
      }
      .output-folder {
        padding: 6px 9px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--dimmer);
        font: 11px var(--mono);
      }
      .output-count {
        margin-left: auto;
        color: #a4abb5;
      }
      .output-tree .next-steps-nav-item.output {
        padding-left: 15px;
        font-family: var(--mono);
        font-size: 11px;
      }
      .output-tree-empty {
        padding: 8px 12px 8px 31px;
        color: #a4abb5;
        font: 10.5px var(--mono);
      }
      .file-glyph {
        flex: none;
        border: 1px solid #d9e2f5;
        border-radius: 4px;
        background: #f2f6ff;
        color: #526086;
        padding: 1px 3px;
        font: 600 8px var(--mono);
        text-transform: uppercase;
      }
      .next-steps-panel {
        min-width: 0;
        min-height: 0;
        padding: 20px 22px 26px;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
      .output-filebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding-bottom: 13px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--line2);
      }
      .output-filebar strong {
        color: var(--ink);
        font-size: 13px;
      }
      .output-filebar > span:last-child {
        margin-left: auto;
        color: var(--dimmer);
        font: 10.5px var(--mono);
      }
      .output-markdown {
        max-width: 92ch;
      }
      .gate5-guide {
        border: 1px solid #dfe5ee;
        border-radius: 12px;
        background: linear-gradient(135deg, #f8faff, #fff);
        padding: 18px;
      }
      .gate5-kicker {
        color: var(--blue);
        font: 600 10.5px var(--mono);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .gate5-intro h2 {
        margin: 6px 0 4px;
        font-size: 19px;
      }
      .gate5-intro p {
        margin: 0;
        max-width: 74ch;
        color: var(--dim);
        line-height: 1.5;
      }
      .gate5-steps {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .gate5-step {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        border: 1px solid var(--line2);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.82);
        padding: 12px;
      }
      .gate5-step > div {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .gate5-step strong {
        color: var(--ink);
        font-size: 13px;
      }
      .gate5-step span:not(.gate5-number):not(.gate5-idea) {
        color: var(--dimmer);
        font: 11px var(--mono);
      }
      .gate5-number {
        width: 22px;
        height: 22px;
        flex: none;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #e9effc;
        color: var(--blue);
        font: 600 11px var(--mono);
      }
      .gate5-ideas {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .gate5-idea {
        display: inline-flex;
        width: fit-content;
        border: 1px solid #d9e2f5;
        border-radius: 999px;
        background: #f2f6ff;
        color: #526086;
        padding: 2px 7px;
        font: 600 10.5px var(--mono);
      }
      .gate5-terminal-note,
      .gate5-wait {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid #e5e9f1;
        color: var(--dim);
        font-size: 12px;
      }
      .gate5-wait {
        margin: 0;
        padding: 0;
        border: 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .gate5-integrity {
        display: flex;
        flex-direction: column;
        gap: 3px;
        border: 1px solid #efd8bd;
        border-radius: 9px;
        background: #fff9f2;
        color: #7d4a2f;
        padding: 11px 13px;
        font-size: 12px;
      }
      .gate5-integrity span {
        color: #8b674f;
      }
      .gate5-rows {
        border-top: 1px solid var(--line2);
        /* pays back the search bar's negative top margin, so it only hugs the
           panel top once it is actually stuck */
        padding-top: 20px;
      }
      .gate5-tools {
        position: sticky;
        /* Bleed over the panel's 20px/22px padding, so rows scroll under the bar
           instead of past it above and beside. */
        top: -20px;
        margin: -20px -22px 0;
        padding: 20px 22px 12px;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 9px;
        background: #fff;
      }
      .gate5-search {
        flex: 1;
      }
      .gate5-search input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
        color: var(--ink);
        padding: 8px 10px;
        font: 12px var(--sans);
        outline: none;
      }
      .gate5-search input:focus {
        border-color: #a9bce4;
        box-shadow: 0 0 0 3px rgba(70, 109, 190, 0.1);
      }
      .gate5-filters {
        display: flex;
        padding: 2px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--soft);
      }
      .gate5-filter {
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--dim);
        padding: 5px 9px;
        cursor: pointer;
        font: 11px var(--mono);
      }
      .gate5-filter.on {
        background: #fff;
        color: var(--ink);
        box-shadow: 0 1px 3px rgba(25, 32, 45, 0.09);
      }
      .gate5-visible {
        min-width: 58px;
        color: var(--dimmer);
        text-align: right;
        font: 10.5px var(--mono);
      }
      .gate5-list .tick {
        margin: 0;
        padding: 9px 2px;
        border-bottom: 1px solid #f0f2f5;
      }
      .gate5-list .tick:last-child {
        border-bottom: 0;
      }
      .gate5-list .tick[hidden] {
        display: none;
      }
      #doc h1,
      #doc h2,
      #doc h3,
      #doc h4 {
        font-weight: 600;
        line-height: 1.35;
        color: var(--ink);
      }
      #doc .h1 {
        font-size: 21px;
        letter-spacing: -0.022em;
        margin: 0 0 7px;
      }
      #doc .h2 {
        font: 600 11px/1.4 var(--mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #526086;
        margin: 25px 0 10px;
        display: flex;
        align-items: baseline;
        gap: 9px;
      }
      #doc .h2::after {
        content: "";
        height: 1px;
        background: var(--line2);
        flex: 1;
      }
      #doc .h3 {
        font-size: 15px;
        letter-spacing: -0.015em;
        margin: 18px 0 6px;
      }
      #doc .h4 {
        font-size: 13px;
        margin: 14px 0 5px;
        color: var(--dim);
      }
      #doc .ro {
        order: 2;
        font: 400 10.5px var(--mono);
        letter-spacing: 0;
        text-transform: none;
        color: var(--dimmer);
      }
      #doc p {
        margin: 7px 0;
        color: var(--ink2);
        font-size: 13.5px;
        line-height: 1.65;
        text-wrap: pretty;
      }
      #doc hr {
        border: 0;
        border-top: 1px solid var(--line2);
        margin: 20px 0;
      }
      #doc ul {
        margin: 7px 0 16px;
        padding: 0;
        list-style: none;
        max-width: 100ch;
      }
      #doc li {
        position: relative;
        margin: 6px 0;
        padding-left: 18px;
        color: var(--ink2);
        line-height: 1.58;
        text-wrap: pretty;
      }
      #doc li::before {
        content: "—";
        position: absolute;
        left: 0;
        color: #c8cfd8;
      }
      #doc li.sub {
        color: var(--dim);
        padding-left: 30px;
      }
      #doc code {
        font: 12px var(--mono);
        background: #f0f2f5;
        padding: 1px 4px;
        border-radius: 4px;
        color: #4b5565;
      }
      #doc pre.code {
        background: var(--soft);
        border: 1px solid var(--line2);
        border-radius: 8px;
        padding: 12px 14px;
        overflow: auto;
        color: #596273;
        font: 11.5px/1.55 var(--mono);
        margin: 10px 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #doc pre.ro-block {
        border-style: dashed;
      }

      /* tables and sources */
      .table {
        margin: -4px 0 0;
      }
      .row {
        padding: 13px 0;
        border-bottom: 1px solid #f0f2f5;
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row .r1 {
        display: flex;
        gap: 9px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .row .ic {
        display: none;
      }
      .row .nm {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: -0.012em;
        color: var(--ink);
      }
      .row .ty,
      .row .me {
        font: 10.5px var(--mono);
        padding: 2px 7px;
        border-radius: 5px;
      }
      .row .ty {
        color: #526086;
        background: #f2f4fb;
        border: 1px solid #e2e6f2;
      }
      .row .me {
        color: #7b8290;
        background: #f2f4f7;
        border: 1px solid #e6e9ed;
      }
      .row .lc {
        font: 11.5px var(--mono);
        color: #a4abb5;
        margin-left: auto;
      }
      .row .r2 {
        color: #5c636e;
        font-size: 12.5px;
        line-height: 1.5;
        margin-top: 4px;
        max-width: 96ch;
      }
      .row .r3 {
        font-size: 11.5px;
        margin-top: 5px;
      }
      .row.plain {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        padding: 12px 0;
      }
      .row.plain .c {
        color: var(--dim);
        font-size: 12.5px;
      }
      .row.plain .c b {
        font: 500 10.5px var(--mono);
        color: var(--dimmer);
        margin-right: 3px;
      }

      #main-column,
      #source-sections {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #main-column {
        min-width: 0;
      }
      #source-sections:empty {
        display: none;
      }
      .source-info-card {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .source-info-card > summary {
        position: relative;
        padding: 11px 34px 11px 13px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
        list-style: none;
      }
      .source-info-card > summary::-webkit-details-marker {
        display: none;
      }
      .source-info-card > summary::after {
        content: "›";
        position: absolute;
        right: 14px;
        top: 14px;
        color: var(--dimmer);
      }
      .source-info-card[open] > summary::after {
        transform: rotate(90deg);
      }
      .source-info-title {
        font-weight: 600;
        color: var(--ink);
      }
      .source-info-preview {
        color: var(--dim);
        font-size: 12px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .source-info-card[open] .source-info-preview {
        display: none;
      }
      .source-info-body {
        padding: 2px 13px 12px;
        border-top: 1px solid var(--line2);
        background: var(--soft);
        /* ponytail: a plain max-height scrolls; making <details> a flex column did not */
        max-height: min(420px, 46vh);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
      .source-info-body > :first-child {
        margin-top: 9px;
      }
      .source-info-body p {
        margin: 8px 0;
        color: var(--ink2);
        font-size: 12.5px;
        line-height: 1.55;
      }
      .source-info-body ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }
      .source-info-body li {
        margin: 6px 0;
        color: var(--ink2);
        font-size: 12.5px;
        line-height: 1.5;
      }
      .source-info-body code {
        font: 11px var(--mono);
        background: #f0f2f5;
        padding: 1px 4px;
        border-radius: 4px;
      }

      /* run stats and cards */
      .run-stale {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 18px;
        padding: 12px 15px;
        border: 1px solid #e8c68f;
        border-radius: 10px;
        background: #fff8ed;
        color: #754620;
        font-size: 12px;
      }
      .run-stale span {
        color: #876548;
        font: 11.5px var(--mono);
      }
      .stats {
        border: 1px solid var(--line2);
        border-radius: 10px;
        padding: 15px 17px;
        background: var(--soft);
        margin-bottom: 18px;
      }
      .stat-line {
        font: 11.5px var(--mono);
        color: #7b8290;
        margin-bottom: 9px;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 5px 0;
        font: 11.5px var(--mono);
      }
      .bar .bl {
        width: 74px;
        color: var(--dim);
      }
      .bar .bn {
        width: 44px;
        text-align: right;
        color: var(--ink);
      }
      .bar-track {
        height: 6px;
        flex: 1;
        background: #eef0f3;
        border-radius: 20px;
        overflow: hidden;
      }
      .bar .bb {
        height: 100%;
        display: block;
        background: #7082ad;
        border-radius: 20px;
        min-width: 2px;
      }
      .blocked {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--line2);
        color: var(--red);
        font-size: 11.5px;
      }
      .card {
        border: 1px solid #d8dde5;
        border-radius: 10px;
        margin: 13px 0;
        overflow: hidden;
        background: #fff;
      }
      .card:hover {
        border-color: #bcc5d0;
      }
      .card.ticked {
        border-color: #8fcaa5;
        background: var(--green-soft);
      }
      .card-top {
        padding: 14px 16px 15px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .card-title-copy {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        flex: 1;
      }
      .card h3 {
        margin: 0 !important;
        padding: 0 !important;
        font-size: 14.5px !important;
        letter-spacing: -0.015em !important;
      }
      .card-summary {
        font-size: 12.5px;
        color: #5c6472;
        line-height: 1.5;
      }
      .card-source {
        font: 11px var(--mono);
        color: #9aa2af;
        white-space: nowrap;
        margin-left: 16px;
        padding-top: 1px;
      }
      .card-criteria {
        padding: 13px 16px;
        background: var(--soft);
        border-top: 1px solid var(--line2);
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .criterion-row {
        display: grid;
        grid-template-columns: 52px 18px minmax(0, 1fr);
        gap: 8px;
        align-items: baseline;
      }
      .criterion-tier {
        font: 11px var(--mono);
        color: #919aa8;
      }
      .criterion-mark {
        font: 500 12px var(--mono);
      }
      .criterion-mark.pass {
        color: #168a51;
      }
      .criterion-mark.warn {
        color: #b36c12;
      }
      .criterion-mark.fail {
        color: #c9483d;
      }
      .criterion-mark.unknown {
        color: #8a6470;
      }
      .criterion-text {
        font-size: 12.5px;
        line-height: 1.5;
        color: #353c48;
        text-wrap: pretty;
      }
      .card-foot {
        padding: 10px 16px 11px;
        background: var(--soft);
        border-top: 1px solid var(--line2);
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
      }
      .card-metrics {
        font: 600 11.5px var(--mono);
        color: #66707e;
      }
      .card-comment {
        font-size: 12.5px;
        color: #7a8390;
        font-style: italic;
        text-wrap: pretty;
      }
      .compact-result-card .card-top {
        padding-bottom: 12px;
      }
      .compact-result-card .card-source {
        padding: 2px 7px;
        border-radius: 999px;
        background: #eef6f1;
        color: #56806a;
      }
      .compact-result-card .card-foot {
        padding-top: 8px;
        padding-bottom: 9px;
      }
      .result-overview,
      .result-section {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        overflow: hidden;
        margin-bottom: 12px;
      }
      .result-overview-head,
      .result-section-head {
        min-height: 46px;
        padding: 0 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        list-style: none;
        font-weight: 600;
        color: var(--ink);
      }
      .result-overview-head::-webkit-details-marker,
      .result-section-head::-webkit-details-marker {
        display: none;
      }
      .result-overview-head::after,
      .result-section-head::after {
        content: "›";
        margin-left: auto;
        color: var(--dimmer);
        font: 600 14px var(--mono);
      }
      .result-overview[open] > .result-overview-head::after,
      .result-section[open] > .result-section-head::after {
        transform: rotate(90deg);
      }
      .result-overview-preview {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: var(--dim);
        font: 400 11.5px var(--mono);
      }
      .result-overview-body,
      .result-section-body {
        border-top: 1px solid var(--line2);
        padding: 14px 15px 16px;
      }
      .result-overview-body {
        background: var(--soft);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .result-overview[open] > .result-overview-body,
      .result-section.result-dropped[open] > .result-section-body {
        max-height: min(520px, 55vh);
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }
      .result-run-stats {
        display: grid;
        grid-template-columns: 1.5fr repeat(4, minmax(80px, 1fr));
        gap: 8px;
        margin-bottom: 2px;
      }
      .result-run-stat {
        padding: 10px 12px;
        border: 1px solid var(--line2);
        border-radius: 8px;
        background: #fff;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .result-run-stat span {
        color: var(--dimmer);
        font: 10px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .result-run-stat strong {
        color: var(--ink);
        font: 600 13px var(--mono);
      }
      .result-overview-note,
      .result-overview-point {
        padding: 0 2px;
      }
      .result-overview-point {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 8px;
        padding: 12px;
        border-radius: 8px;
        background: #fff;
      }
      .result-overview-number {
        width: 21px;
        height: 21px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #e9edf5;
        color: #526086;
        font: 600 10.5px var(--mono);
        margin-top: 2px;
      }
      #doc .result-overview-note p,
      #doc .result-overview-point p {
        margin: 0;
        max-width: 112ch;
        line-height: 1.55;
      }
      .result-section-count {
        font: 600 10.5px var(--mono);
        color: #66707e;
        background: #eef0f3;
        padding: 2px 7px;
        border-radius: 20px;
      }
      .result-section-body > .card:first-child {
        margin-top: 0;
      }
      .result-section-body > .card:last-child {
        margin-bottom: 0;
      }
      .result-section.result-dropped > .result-section-head {
        color: #8a4d35;
        background: #fffaf5;
      }
      .dropped-groups {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
      }
      .dropped-group {
        border: 1px solid #eadfd8;
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }
      .dropped-group-head {
        padding: 10px 12px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        align-items: baseline;
        cursor: pointer;
        list-style: none;
        background: #fffaf5;
      }
      .dropped-group-head::-webkit-details-marker {
        display: none;
      }
      .dropped-rule-number {
        color: #a94d39;
        font: 600 10.5px var(--mono);
        text-transform: uppercase;
      }
      .dropped-rule-text {
        color: var(--ink2);
        font-size: 12.5px;
        line-height: 1.45;
      }
      .dropped-rule-count {
        min-width: 24px;
        text-align: center;
        color: #8a4d35;
        background: #f8e9df;
        border-radius: 20px;
        padding: 2px 6px;
        font: 600 10.5px var(--mono);
      }
      .dropped-rows {
        border-top: 1px solid #eadfd8;
      }
      .dropped-row {
        padding: 10px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid var(--line2);
      }
      .dropped-row:last-child {
        border-bottom: 0;
      }
      .dropped-row-copy {
        min-width: 0;
        flex: 1;
      }
      .dropped-row-title {
        color: var(--ink);
        font-size: 12.5px;
        font-weight: 600;
      }
      .dropped-row-source {
        color: var(--dimmer);
        font: 10.5px var(--mono);
        font-weight: 400;
        margin-left: 8px;
      }
      .dropped-row-reason {
        color: var(--dim);
        font-size: 12px;
        line-height: 1.45;
        margin-top: 3px;
      }
      .dropped-row-open {
        width: 27px;
        height: 27px;
        flex: none;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--dim);
        font: 600 13px var(--mono);
      }
      .dropped-row-open:hover {
        background: var(--soft);
        text-decoration: none;
      }
      .result-section.result-gone > .result-section-head {
        color: var(--dim);
      }
      .result-empty {
        color: var(--dimmer);
        font-size: 12.5px;
      }
      .tick {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        cursor: pointer;
        margin: 8px 0;
        user-select: none;
      }
      .card-top .tick {
        margin: 1px 0 0;
      }
      .card-top .tick-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .tick input {
        appearance: none;
        width: 16px;
        height: 16px;
        border: 1.5px solid #c8cfd8;
        border-radius: 4px;
        background: #fff;
        margin: 2px 0 0;
        cursor: pointer;
        display: grid;
        place-content: center;
        flex: none;
      }
      .card-top .tick input {
        width: 18px;
        height: 18px;
        margin: 0;
      }
      .tick input::before {
        content: "✓";
        font: 600 11px var(--sans);
        color: #fff;
        transform: scale(0);
      }
      .tick input:checked {
        border-color: var(--green);
        background: var(--green);
      }
      .tick input:checked::before {
        transform: scale(1);
      }
      .tick input:disabled {
        opacity: 0.55;
      }
      .tick-label {
        color: var(--dim);
        font-size: 12.5px;
      }
      .tick input:checked ~ .tick-label {
        color: #287d4b;
      }

      /* criteria */
      .criteria-layout {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-areas:
          "must nice"
          "range range"
          "open open"
          "notes carried"
          "prefilter prefilter";
        column-gap: 28px;
        row-gap: 24px;
      }
      .criteria-layout > .criteria-must {
        grid-area: must;
      }
      .criteria-layout > .criteria-nice {
        grid-area: nice;
      }
      .criteria-layout > .criteria-range {
        grid-area: range;
      }
      .criteria-layout > .criteria-open {
        grid-area: open;
      }
      .criteria-layout > .criteria-notes {
        grid-area: notes;
      }
      .criteria-layout > .criteria-not-carried-over {
        grid-area: carried;
      }
      .criteria-layout > .criteria-prefilter {
        grid-area: prefilter;
      }
      .criteria-layout:not(:has(.criteria-notes)) > .criteria-not-carried-over,
      .criteria-layout:not(:has(.criteria-not-carried-over)) > .criteria-notes {
        grid-column: 1 / -1;
      }
      .criteria-head .count-badge {
        color: #14673a;
        background: #e4f7ea;
        border: 1px solid #b8e4c6;
        border-radius: 6px;
        padding: 3px 8px;
      }
      .criteria-section {
        margin: 0;
      }
      .criteria-section:last-child {
        margin-bottom: 0;
      }
      .criteria-section-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .criteria-name {
        font: 600 11px var(--mono);
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #526086;
        white-space: nowrap;
      }
      .criteria-rule {
        height: 1px;
        background: var(--line2);
        flex: 1;
      }
      .criteria-guide {
        font: 10.5px var(--mono);
        color: #98a1ae;
        white-space: nowrap;
      }
      .criteria-range .criteria-name {
        color: #a46510;
      }
      .criteria-nice .criteria-name,
      .criteria-open .criteria-name,
      .criteria-not-carried-over .criteria-name,
      .criteria-notes .criteria-name {
        color: #7f8896;
      }
      #doc .criteria-section ul {
        max-width: none;
        margin: 0;
      }
      #doc .criteria-section li {
        margin: 8px 0;
        line-height: 1.58;
      }
      .criteria-not-carried-over,
      .criteria-notes {
        padding: 16px 18px;
        background: var(--soft);
        border: 1px solid var(--line2);
        border-radius: 9px;
      }
      .criteria-not-carried-over .criteria-rule,
      .criteria-notes .criteria-rule {
        display: none;
      }
      #doc .criteria-not-carried-over li,
      #doc .criteria-notes li {
        color: #65707f;
      }
      #doc .criteria-not-carried-over .criteria-section-body > p:last-child {
        max-width: none;
        margin: 10px 0 0;
        padding-top: 9px;
        border-top: 1px solid var(--line2);
        color: #7f8896;
        font-size: 12.5px;
      }
      .criteria-prefilter .criteria-section-body {
        color: #5c636e;
      }
      .prefilter-head {
        gap: 9px;
        margin-bottom: 12px;
      }
      .prefilter-derived {
        font: 10.5px var(--mono);
        color: #98a1ae;
        white-space: nowrap;
      }
      .prefilter-patterns {
        position: relative;
        flex: 0 0 auto;
      }
      .prefilter-patterns summary {
        color: #465f9c;
        cursor: pointer;
        font-size: 11.5px;
        font-weight: 600;
        list-style: none;
        white-space: nowrap;
      }
      .prefilter-patterns summary::-webkit-details-marker {
        display: none;
      }
      .prefilter-patterns summary::after {
        content: "";
        display: inline-block;
        margin-left: 5px;
        border: 4px solid transparent;
        border-top-color: #465f9c;
        transform: translateY(3px);
      }
      .prefilter-patterns[open] summary::after {
        transform: translateY(-1px) rotate(180deg);
      }
      #doc .prefilter-patterns pre {
        position: absolute;
        z-index: 2;
        right: 0;
        width: min(880px, 78vw);
        max-height: 300px;
        margin: 0;
        overflow: auto;
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px rgba(28, 36, 49, 0.12);
      }
      #doc .prefilter-intro {
        max-width: 92ch;
        margin: 0 0 12px;
        color: #586170;
        font-size: 12.5px;
        line-height: 1.55;
      }
      .prefilter-rows {
        display: grid;
        gap: 7px;
      }
      .prefilter-row {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        min-height: 40px;
        padding: 0 14px;
        background: var(--soft);
        border: 1px solid var(--line2);
        border-radius: 8px;
        color: #586170;
        font-size: 12.5px;
      }
      .prefilter-key {
        color: #40547d;
        font: 600 11.5px var(--mono);
      }
      #doc .prefilter-loader {
        max-width: none;
        margin: 11px 0 0;
        color: #98a1ae;
        font: 10.5px/1.5 var(--mono);
      }

      /* a source that is not `ok` says which not-ok it is — blocked and error are not
         the same problem, and the page must not flatten them into one word */
      .src .st {
        font: 500 10.5px var(--mono);
        color: #a94d39;
        background: var(--red-soft);
        border: 1px solid #efd8d0;
        padding: 1px 6px;
        border-radius: 5px;
      }
      .src .mn {
        font: 500 10.5px var(--mono);
        color: #287d4b;
        background: var(--green-soft);
        border: 1px solid #cfe9da;
        padding: 1px 6px;
        border-radius: 5px;
      }
      .handcheck {
        margin-top: 8px;
      }
      .handcheck-head {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .copy-prompt {
        width: 27px;
        height: 27px;
        font: 600 14px var(--mono);
        color: #4a5563;
        cursor: pointer;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0;
      }
      .copy-prompt:hover {
        border-color: #bcc5d0;
        background: var(--soft);
      }
      .handcheck-open {
        width: 27px;
        height: 27px;
        display: inline-grid;
        place-items: center;
        font: 600 14px var(--mono);
        color: #4a5563;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .handcheck-open:hover {
        text-decoration: none;
        background: var(--soft);
      }
      .manual select {
        font: 11.5px var(--mono);
        color: var(--ink2);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        height: 27px;
        padding: 2px 7px;
      }

      /* gaps */
      #gaps {
        overflow: hidden;
        border-color: #eadfce;
      }
      /* Empty is invisible, not gone: the column stays, so switching stage moves nothing. */
      #gaps.empty {
        visibility: hidden;
        border-color: transparent;
        background: none;
        box-shadow: none;
      }
      .gaps-head {
        padding: 15px 20px;
        background: #fffaf2;
        border-bottom: 1px solid #eee2cf;
        display: flex;
        align-items: center;
        gap: 9px;
        position: sticky;
        top: 0;
        z-index: 3;
      }
      .gaps-head h2 {
        font-size: 16.5px;
        letter-spacing: -0.015em;
        color: #6e4525;
        margin: 0;
      }
      .gap-count {
        font: 600 11px var(--mono);
        color: #fff;
        background: #c78332;
        padding: 2px 7px;
        border-radius: 20px;
      }
      .gaps-only {
        font: 11px var(--mono);
        color: #a27851;
        margin-left: auto;
      }
      .gaps-body {
        padding: 3px 20px 12px;
      }
      .gap {
        padding: 12px 0;
        border-bottom: 1px solid #f0f2f5;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .gap:last-child {
        border-bottom: 0;
      }
      .gap-top {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .gap-identity {
        display: flex;
        align-items: baseline;
        gap: 6px;
        min-width: 0;
        flex: 1;
      }
      .gap-name {
        font-size: 13px;
        font-weight: 600;
        color: #653e27;
      }
      .gap-dash {
        color: var(--dimmer);
      }
      .gap-date {
        font: 10.5px var(--mono);
        color: #a4abb5;
      }
      .gap-reason {
        font: 500 10.5px var(--mono);
        color: #a94d39;
        background: var(--red-soft);
        border: 1px solid #efd8d0;
        border-radius: 5px;
        padding: 1px 6px;
      }
      .gap-note {
        font-size: 12px;
        color: #5c636e;
        line-height: 1.5;
        text-wrap: pretty;
      }
      .gap a {
        font-size: 11.5px;
      }

      /* terminal and toast */
      #terminal-bar {
        height: 45px;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
        border-top: 1px solid var(--line);
        z-index: 25;
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #terminal-toggle {
        border: 0;
        background: transparent;
        padding: 6px 0;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #4a5160;
        font-weight: 500;
        cursor: pointer;
      }
      #terminal-toggle:hover {
        color: var(--ink);
      }
      .terminal-glyph {
        font-family: var(--mono);
        color: var(--dimmer);
      }
      #terminal-copy {
        font: 11.5px var(--mono);
        color: var(--dimmer);
        flex: 1;
      }
      #term {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 45px;
        height: min(48vh, 520px);
        background: #111419;
        border-top: 1px solid #252a34;
        z-index: 24;
        display: none;
      }
      body.terminal-open #term {
        display: block;
      }
      #term iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      .noterm {
        padding: 28px 30px;
        color: #9aa1ac;
        max-width: 560px;
        font: 13px/1.6 var(--mono);
      }
      .noterm b {
        color: #e7e9ed;
      }
      .noterm pre {
        background: #181c23;
        border: 1px solid #2b313c;
        padding: 11px 13px;
        border-radius: 7px;
        color: #64cb82;
        white-space: pre-wrap;
      }
      #note {
        position: fixed;
        left: 24px;
        bottom: 60px;
        background: #20242c;
        color: #fff;
        padding: 9px 13px;
        border-radius: 7px;
        font-size: 12px;
        max-width: min(560px, calc(100vw - 48px));
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.2);
        opacity: 0;
        transform: translateY(6px);
        transition: 0.16s;
        pointer-events: none;
        z-index: 50;
      }
      #note.show {
        opacity: 1;
        transform: none;
      }
      @media (max-width: 900px) {
        #topbar {
          padding: 0 16px;
        }
        .form-label,
        .shortcut {
          display: none;
        }
        #new-session {
          font-size: 12.5px;
        }
        #workspace {
          padding: 16px;
        }
        .shape-tag {
          max-width: 160px;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        #stage-card {
          flex-direction: column;
          padding: 17px;
        }
        #stage-action {
          flex: 0 0 auto;
          width: 100%;
          min-width: 0;
          border-left: 0;
          border-top: 1px solid var(--line2);
          padding: 14px 0 0;
          align-items: flex-start;
        }
        #stage-note {
          text-align: left;
        }
        #content-grid,
        #content-grid.sources-layout {
          grid-template-columns: minmax(0, 1fr);
        }
        body.sources-page #content-grid {
          grid-template-rows: repeat(2, minmax(0, 1fr));
        }
        #gaps.empty {
          display: none;
        }
        .next-steps-shell {
          grid-template-columns: 180px minmax(0, 1fr);
        }
        .card-source {
          white-space: normal;
          text-align: right;
        }
      }
      @media (max-width: 620px) {
        #topbar {
          height: auto;
          min-height: 58px;
          flex-wrap: wrap;
          padding-block: 10px;
          gap: 8px;
        }
        #session-meta {
          order: 3;
          width: 100%;
        }
        #stage-card {
          overflow: hidden;
        }
        #chips {
          width: 100%;
          overflow-x: auto;
          grid-template-columns: repeat(
            var(--stage-count),
            minmax(130px, 1fr)
          ) !important;
        }
        .chip {
          min-width: 130px;
        }
        .dochead,
        .docbody {
          padding-left: 16px;
          padding-right: 16px;
        }
        .dochead .file-meta {
          width: 100%;
          margin-left: 0;
        }
        .gate5-steps {
          grid-template-columns: minmax(0, 1fr);
        }
        .next-steps-shell {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr);
        }
        .next-steps-sidebar {
          position: static;
          min-height: 0;
          border-right: 0;
          border-bottom: 1px solid var(--line2);
        }
        .output-filebar {
          align-items: flex-start;
          flex-wrap: wrap;
        }
        .output-filebar > span:last-child {
          width: 100%;
          margin-left: 0;
        }
        .gate5-tools {
          flex-wrap: wrap;
        }
        .gate5-search {
          flex-basis: 100%;
        }
        .card-top {
          flex-wrap: wrap;
        }
        .card-source {
          width: 100%;
          margin-left: 30px;
          text-align: left;
        }
        .criterion-row {
          grid-template-columns: 44px 16px minmax(0, 1fr);
          gap: 6px;
        }
        .criteria-section-head {
          align-items: flex-start;
          flex-wrap: wrap;
        }
        .criteria-layout {
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas:
            "must"
            "nice"
            "range"
            "open"
            "notes"
            "carried"
            "prefilter";
          gap: 20px;
        }
        .result-run-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .result-run-stat:first-child {
          grid-column: 1 / -1;
        }
        .dropped-group-head {
          grid-template-columns: auto 1fr auto;
        }
        .criteria-guide {
          width: 100%;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <header id="topbar">
      <nav id="tabs" aria-label="Sessions"></nav>
      <div id="session-meta"></div>
      <button id="new-session" type="button">New session</button>
      <span class="shortcut">⌘K to switch</span>
    </header>
    <main id="workspace">
      <section id="stage-card" aria-label="Session progress">
        <nav id="chips" aria-label="Stages"></nav>
        <div id="stage-action">
          <div id="stage-note"></div>
        </div>
      </section>
      <div id="content-grid">
        <div id="main-column">
          <article id="document-card"><div id="doc"></div></article>
          <aside id="source-sections"></aside>
        </div>
        <aside id="gaps" class="empty"></aside>
      </div>
    </main>
    <aside id="term" aria-label="Terminal"></aside>
    <footer id="terminal-bar">
      <button id="terminal-toggle" type="button" aria-expanded="false">
        <span class="terminal-glyph">›_</span><span>terminal</span></button
      ><span id="terminal-copy"
        >detached — every session still runs from the files</span
      ><span class="shortcut">⌘J</span>
    </footer>
    <div id="note" role="status" aria-live="polite"></div>
    <script src="/app.js"></script>
  </body>
</html>
